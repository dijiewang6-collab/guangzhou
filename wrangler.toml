name = "guangzhou"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
# /api/* 强制走 Worker fetch handler,其余路径优先匹配静态资源
run_worker_first = ["/api/*"]

# 环境变量在 Cloudflare 控制台 (Workers & Pages > guangzhou > Settings > Variables) 配置:
#   EMAIL_TO  收信邮箱 (可选, 默认 931097380@qq.com)
#   SCT_KEY   Server 酱 SendKey (微信推送, 不配则跳过)
# 切勿把 SCT_KEY 写进本文件以免提交到 git
